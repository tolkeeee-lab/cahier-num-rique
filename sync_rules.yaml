# PowerSync Sync Rules for Cahier Numerique
bucket_definitions:
  # The "user" bucket represents the data specific to a given shop.
  user_shop:
    # We parameterize the bucket by the shop_id (which comes from the JWT payload token)
    parameters:
      - shop_id: string
    data:
      - SELECT * FROM sales WHERE shop_id = bucket.shop_id
      - SELECT * FROM sold_articles WHERE shop_id = bucket.shop_id
      - SELECT * FROM products WHERE shop_id = bucket.shop_id
      - SELECT * FROM cash_closings WHERE shop_id = bucket.shop_id
      - SELECT * FROM shopping_list WHERE shop_id = bucket.shop_id
